[package]
name = "okerrr"
version = "0.1.0"
edition = "2021"
rust-version = "1.56"
authors = ["Adam Williams"]
description = "programmatic freedom from having to match Result<T, E>, okerrr!"
readme = "README.md"
repository = "https://github.com/awill1988/okerrr"
license = "MIT OR Apache-2.0"
keywords = ["macros", "error-handling", "pattern-matching", "control-flow", "result"]
categories = ["rust-patterns", "no-std", "development-tools"]

[dependencies]
tracing = { version = "0.1", default-features = false, optional = true }

[features]
default = []
tracing = ["dep:tracing"]
otel = ["tracing"]

[dev-dependencies]
tracing-subscriber = "0.3"
